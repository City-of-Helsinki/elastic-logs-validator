<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Stream Manual Review</title>
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-sidebar: #0b1120;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #38bdf8;
            --badge-active: #0369a1;
            --badge-empty: #475569;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
        .sidebar-header h1 { font-size: 1.1rem; color: var(--accent); }
        .sidebar-header .stats { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; }
        .nav-list { overflow-y: auto; flex-grow: 1; padding: 10px; width: 320px; }
        .nav-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 0.875rem;
            word-break: break-all;
        }
        .nav-item:hover { background: var(--bg-surface); color: var(--text-main); }
        .badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; white-space: nowrap; margin-left: 8px; }
        .badge.active { background: var(--badge-active); color: #e0f2fe; }
        .badge.empty { background: var(--badge-empty); color: #cbd5e1; }
        #main { flex-grow: 1; overflow-y: auto; padding: 30px; }
        .stream-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .stream-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .stream-header h2 code { font-size: 1.2rem; color: var(--accent); }
        .meta-tag { font-size: 0.85rem; color: var(--text-muted); }
        .empty-state { color: var(--text-muted); font-style: italic; font-size: 0.9rem; }
        .doc-wrapper {
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .doc-summary {
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            background: #131d31;
            user-select: none;
        }
        .doc-summary .ts { font-weight: normal; color: var(--text-muted); margin-left: 10px; font-family: monospace; }
        .json-block {
            padding: 14px;
            overflow-x: auto;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 0.85rem;
            line-height: 1.45;
            color: #e2e8f0;
        }
    </style>
</head>
<body>
    <aside id="sidebar">
        <div class="sidebar-header">
            <h1>Stream Review Report</h1>
            <div class="stats">Streams: $total_streams | Total Documents: $total_docs</div>
        </div>
        <nav class="nav-list">
            $sidebar_items
        </nav>
    </aside>
    <main id="main">
        $content_sections
    </main>
</body>
</html>
